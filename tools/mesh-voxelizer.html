<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesh Voxelizer - The Long Road of the Weyfinder</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #121616;
        color: #f4eee4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #121616, #171918);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button,
      input,
      textarea {
        border: 1px solid rgb(244 238 228 / 0.22);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.54);
        color: #f4eee4;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        font-weight: 760;
        cursor: pointer;
      }

      button:hover {
        border-color: rgb(247 192 106 / 0.55);
      }

      label {
        display: grid;
        gap: 5px;
        min-width: 0;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 700;
      }

      input {
        min-height: 36px;
        padding: 0 9px;
      }

      textarea {
        width: 100%;
        min-height: 420px;
        padding: 10px;
        resize: vertical;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        background: rgb(8 11 11 / 0.58);
      }

      .title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .title p {
        margin: 3px 0 0;
        color: #d7ceb8;
        font-size: 12px;
      }

      .actions,
      .tool-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .actions {
        justify-content: flex-end;
      }

      .build-version {
        display: inline-grid;
        place-items: center;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid rgb(244 238 228 / 0.16);
        border-radius: 8px;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 760;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(360px, 1fr) minmax(300px, 460px);
        gap: 14px;
        padding: 14px;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid rgb(244 238 228 / 0.14);
        border-radius: 8px;
        background: rgb(20 23 24 / 0.72);
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        font-size: 13px;
        letter-spacing: 0;
      }

      .form {
        display: grid;
        gap: 11px;
        padding: 12px;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .preview-panel {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .canvas-wrap {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 12px;
      }

      #voxelCanvas {
        width: min(100%, 720px);
        aspect-ratio: 1;
        border: 1px solid rgb(244 238 228 / 0.18);
        border-radius: 8px;
        background: #0d1010;
      }

      .status {
        display: grid;
        gap: 5px;
        padding: 10px 12px;
        border-top: 1px solid rgb(244 238 228 / 0.12);
        color: #d7ceb8;
        font-size: 12px;
      }

      .status strong {
        color: #f4eee4;
      }

      .status .error {
        color: #ff9b89;
      }

      .status .warning {
        color: #f7c06a;
      }

      .output {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      @media (max-width: 1080px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>Mesh Voxelizer</h1>
          <p>OBJ and STL to layered construct JSON.</p>
        </div>
        <div class="actions">
          <span class="build-version" data-build-version></span>
          <a href="../"><button type="button">Game</button></a>
          <a href="./creator-suite.html"><button type="button">Suite</button></a>
          <a href="./creator-guide.html"><button type="button">Guide</button></a>
          <a href="./construct-workshop.html"><button type="button">Constructs</button></a>
          <button id="importMeshButton" type="button">Import Mesh</button>
          <button id="downloadButton" type="button">Download JSON</button>
          <input id="meshFileInput" type="file" accept=".obj,.stl,text/plain,model/obj,model/stl" hidden />
        </div>
      </header>
      <section class="workspace">
        <aside class="panel">
          <h2>Voxelizer</h2>
          <div class="form">
            <label>
              Asset ID
              <input id="assetIdInput" value="creator.voxelized_mesh" autocomplete="off" />
            </label>
            <label>
              Display Name
              <input id="displayNameInput" value="Creator Voxelized Mesh" autocomplete="off" />
            </label>
            <div class="split">
              <label>
                Span
                <input id="spanInput" type="number" min="3" max="31" step="1" value="9" />
              </label>
              <label>
                Sampling
                <input id="sampleDensityInput" type="number" min="1" max="12" step="1" value="4" />
              </label>
            </div>
            <label>
              Preview Layer
              <input id="previewLayerInput" type="number" min="0" max="8" step="1" value="4" />
            </label>
            <div class="tool-row">
              <button id="voxelizeButton" type="button">Voxelize</button>
              <button id="applyJsonButton" type="button">Apply JSON</button>
              <button id="copyJsonButton" type="button">Copy</button>
            </div>
          </div>
        </aside>
        <section class="panel preview-panel">
          <h2>Layer Preview</h2>
          <div class="canvas-wrap">
            <canvas id="voxelCanvas" width="720" height="720" aria-label="Voxelized construct preview"></canvas>
          </div>
          <div id="statusPanel" class="status"></div>
        </section>
        <aside class="panel output">
          <h2>Construct JSON</h2>
          <div class="form">
            <textarea id="jsonOutput" spellcheck="false"></textarea>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/editor/meshVoxelizerTool.js"></script>
  </body>
</html>
