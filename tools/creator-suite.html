<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator Suite - The Long Road of the Weyfinder</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111616;
        color: #f4eee4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #111616, #181b1c);
      }

      button,
      input,
      select {
        font: inherit;
      }

      input,
      select {
        width: 100%;
        min-height: 36px;
        padding: 0 9px;
        border: 1px solid rgb(244 238 228 / 0.2);
        border-radius: 6px;
        background: #0d1111;
        color: #f4eee4;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid rgb(244 238 228 / 0.22);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.58);
        color: #f4eee4;
        font-weight: 760;
        cursor: pointer;
      }

      button:hover,
      button[aria-pressed="true"] {
        border-color: rgb(111 224 191 / 0.62);
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        background: rgb(8 11 11 / 0.62);
      }

      .title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .title p {
        margin: 3px 0 0;
        color: #d7ceb8;
        font-size: 12px;
      }

      .actions,
      .editor-tabs,
      .module-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .build-version {
        display: inline-grid;
        place-items: center;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid rgb(244 238 228 / 0.16);
        border-radius: 8px;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 760;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(330px, 410px) minmax(0, 1fr);
        gap: 12px;
        min-height: 0;
        padding: 12px;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid rgb(244 238 228 / 0.14);
        border-radius: 8px;
        background: rgb(20 23 24 / 0.74);
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        font-size: 13px;
        letter-spacing: 0;
      }

      .module-panel {
        display: grid;
        grid-template-rows: auto auto auto auto minmax(140px, 1fr) auto auto;
      }

      .module-actions {
        padding: 12px;
      }

      .module-list {
        display: grid;
        align-content: start;
        gap: 8px;
        overflow: auto;
        padding: 12px;
        color: #d7ceb8;
        font-size: 12px;
      }

      .bench-filters,
      .selected-asset,
      .report-grid,
      .bench-actions {
        padding: 10px 12px;
        border-top: 1px solid rgb(244 238 228 / 0.1);
      }

      .bench-filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .bench-filters label:first-child {
        grid-column: 1 / -1;
      }

      .bench-filters label {
        display: grid;
        gap: 5px;
        color: #d7ceb8;
        font-size: 11px;
        font-weight: 700;
      }

      .asset-row {
        display: grid;
        gap: 5px;
        width: 100%;
        min-height: 0;
        padding: 8px;
        border: 1px solid rgb(244 238 228 / 0.12);
        border-radius: 6px;
        background: rgb(8 11 11 / 0.36);
        text-align: left;
        font-weight: 500;
      }

      .asset-row[aria-pressed="true"] {
        border-color: #6fe0bf;
        background: rgb(111 224 191 / 0.08);
      }

      .asset-row strong {
        color: #f4eee4;
      }

      .asset-kind,
      .status-tag {
        color: #6fe0bf;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .selected-asset,
      .report,
      .report-grid {
        display: grid;
        gap: 5px;
        color: #d7ceb8;
        font-size: 11px;
      }

      .report-grid {
        grid-template-columns: 1fr 1fr;
      }

      .report {
        align-content: start;
        max-height: 110px;
        overflow: auto;
        padding-right: 5px;
      }

      .report h3 {
        margin: 0 0 3px;
        color: #f4eee4;
        font-size: 11px;
      }

      .bench-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      .status {
        padding: 0 12px 10px;
        color: #d7ceb8;
        font-size: 12px;
      }

      .error {
        color: #ff9b89;
      }

      .warning {
        color: #f7c06a;
      }

      .editor-panel {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .editor-tabs {
        padding: 10px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 680px;
        border: 0;
        background: #0d1010;
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        iframe {
          min-height: 760px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>Creator Suite</h1>
          <p>Unified static shell for construct, enemy, weapon, pattern, level, and encounter tools.</p>
        </div>
        <div class="actions">
          <span class="build-version" data-build-version></span>
          <a href="../"><button type="button">Game</button></a>
          <a href="./creator-guide.html"><button type="button">Guide</button></a>
          <button id="importFolderButton" type="button">Import Folder</button>
          <button id="importFilesButton" type="button">Import Files</button>
          <input id="importFolderInput" type="file" accept="application/json,.json" multiple webkitdirectory hidden />
          <input id="importFilesInput" type="file" accept="application/json,.json" multiple hidden />
        </div>
      </header>
      <section class="workspace">
        <aside class="panel module-panel">
          <h2>Mod Test Bench</h2>
          <div class="module-actions">
            <button id="installExampleButton" type="button">Install Example</button>
            <button id="installZoneEnemyExampleButton" type="button">Install Zone Enemies</button>
            <button id="installSoundEffectsButton" type="button">Install Sounds</button>
            <button id="refreshModulesButton" type="button">Refresh</button>
            <button id="clearStatusButton" type="button">Clear Status</button>
          </div>
          <div id="moduleStatus" class="status"></div>
          <div class="bench-filters">
            <label>
              Installed Pack
              <select id="packSelect"></select>
            </label>
            <label>
              Asset Type
              <select id="assetKindSelect"></select>
            </label>
            <label>
              Find Asset
              <input id="assetSearchInput" type="search" placeholder="Name or ID" />
            </label>
          </div>
          <div id="moduleList" class="module-list"></div>
          <div id="selectedAssetPanel" class="selected-asset"></div>
          <div class="report-grid">
            <section class="report">
              <h3>Validation</h3>
              <div id="validationReport" class="report"></div>
            </section>
            <section class="report">
              <h3>Dependencies</h3>
              <div id="dependencyReport" class="report"></div>
            </section>
          </div>
          <div class="bench-actions">
            <button id="openAssetButton" type="button">Open in Editor</button>
            <button id="testAssetButton" type="button">Test in Sandbox</button>
            <button id="exportPackButton" type="button">Export Pack</button>
            <button id="removePackButton" type="button">Remove Pack</button>
          </div>
        </aside>
        <section class="panel editor-panel">
          <div class="editor-tabs">
            <button type="button" data-editor="./construct-workshop.html" aria-pressed="false">Mob / Construct</button>
            <button type="button" data-editor="./mesh-voxelizer.html" aria-pressed="false">Mesh Voxelizer</button>
            <button type="button" data-editor="./enemy-editor.html" aria-pressed="true">Enemies</button>
            <button type="button" data-editor="./weapon-pattern-lab.html" aria-pressed="false">Projectile / Weapon / Pattern</button>
            <button type="button" data-editor="./level-editor.html" aria-pressed="false">Levels</button>
            <button type="button" data-editor="./encounter-editor.html" aria-pressed="false">Encounters</button>
            <button type="button" data-editor="./material-lighting-editor.html" aria-pressed="false">Materials / Lighting</button>
            <button type="button" data-editor="./creator-guide.html" aria-pressed="false">Guide</button>
          </div>
          <iframe id="editorFrame" title="Creator editor" src="./enemy-editor.html"></iframe>
        </section>
      </section>
    </main>
    <script type="module" src="/src/editor/creatorSuite.js"></script>
  </body>
</html>
