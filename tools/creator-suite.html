<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator Suite - The Long Road of the Weyfinder</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111616;
        color: #f4eee4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #111616, #181b1c);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid rgb(244 238 228 / 0.22);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.58);
        color: #f4eee4;
        font-weight: 760;
        cursor: pointer;
      }

      button:hover,
      button[aria-pressed="true"] {
        border-color: rgb(111 224 191 / 0.62);
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        background: rgb(8 11 11 / 0.62);
      }

      .title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .title p {
        margin: 3px 0 0;
        color: #d7ceb8;
        font-size: 12px;
      }

      .actions,
      .editor-tabs,
      .module-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(250px, 330px) minmax(0, 1fr);
        gap: 12px;
        min-height: 0;
        padding: 12px;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid rgb(244 238 228 / 0.14);
        border-radius: 8px;
        background: rgb(20 23 24 / 0.74);
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        font-size: 13px;
        letter-spacing: 0;
      }

      .module-panel {
        display: grid;
        grid-template-rows: auto auto 1fr;
      }

      .module-actions {
        padding: 12px;
      }

      .module-list {
        display: grid;
        align-content: start;
        gap: 8px;
        overflow: auto;
        padding: 12px;
        color: #d7ceb8;
        font-size: 12px;
      }

      .module-row {
        display: grid;
        gap: 5px;
        padding: 8px;
        border: 1px solid rgb(244 238 228 / 0.12);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.36);
      }

      .module-row strong {
        color: #f4eee4;
      }

      .status {
        padding: 0 12px 10px;
        color: #d7ceb8;
        font-size: 12px;
      }

      .error {
        color: #ff9b89;
      }

      .warning {
        color: #f7c06a;
      }

      .editor-panel {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .editor-tabs {
        padding: 10px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 680px;
        border: 0;
        background: #0d1010;
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        iframe {
          min-height: 760px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>Creator Suite</h1>
          <p>Unified static shell for mob/construct, enemy, projectile/weapon, pattern, bullet, and level tools.</p>
        </div>
        <div class="actions">
          <a href="../"><button type="button">Game</button></a>
          <button id="importFolderButton" type="button">Import Folder</button>
          <button id="importFilesButton" type="button">Import Files</button>
          <input id="importFolderInput" type="file" accept="application/json,.json" multiple webkitdirectory hidden />
          <input id="importFilesInput" type="file" accept="application/json,.json" multiple hidden />
        </div>
      </header>
      <section class="workspace">
        <aside class="panel module-panel">
          <h2>Local Modules</h2>
          <div class="module-actions">
            <button id="installExampleButton" type="button">Install Example</button>
            <button id="installZoneEnemyExampleButton" type="button">Install Zone Enemies</button>
            <button id="refreshModulesButton" type="button">Refresh</button>
            <button id="clearStatusButton" type="button">Clear Status</button>
          </div>
          <div id="moduleStatus" class="status"></div>
          <div id="moduleList" class="module-list"></div>
        </aside>
        <section class="panel editor-panel">
          <div class="editor-tabs">
            <button type="button" data-editor="./construct-workshop.html" aria-pressed="false">Mob / Construct</button>
            <button type="button" data-editor="./enemy-editor.html" aria-pressed="true">Enemies</button>
            <button type="button" data-editor="./weapon-pattern-lab.html" aria-pressed="false">Projectile / Weapon / Pattern</button>
            <button type="button" data-editor="./level-editor.html" aria-pressed="false">Levels</button>
          </div>
          <iframe id="editorFrame" title="Creator editor" src="./enemy-editor.html"></iframe>
        </section>
      </section>
    </main>
    <script type="module" src="/src/editor/creatorSuite.js"></script>
  </body>
</html>
