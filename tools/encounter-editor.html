<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encounter Editor - The Long Road of the Weyfinder</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #121616;
        color: #f4eee4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, rgb(18 22 22 / 0.98), rgb(24 27 27 / 0.96));
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      input,
      select,
      textarea {
        border: 1px solid rgb(244 238 228 / 0.22);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.55);
        color: #f4eee4;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        font-weight: 760;
        cursor: pointer;
      }

      button:hover {
        border-color: rgb(247 192 106 / 0.58);
      }

      label {
        display: grid;
        gap: 5px;
        min-width: 0;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 700;
      }

      input,
      select {
        min-height: 36px;
        padding: 0 9px;
      }

      textarea {
        width: 100%;
        min-height: 260px;
        padding: 10px;
        resize: vertical;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        background: rgb(8 11 11 / 0.58);
      }

      .title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .title p {
        margin: 3px 0 0;
        color: #d7ceb8;
        font-size: 12px;
      }

      .actions,
      .tool-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .actions {
        justify-content: flex-end;
      }

      .build-version {
        display: inline-grid;
        place-items: center;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid rgb(244 238 228 / 0.16);
        border-radius: 8px;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 760;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 410px) minmax(360px, 1fr) minmax(320px, 460px);
        gap: 14px;
        padding: 14px;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid rgb(244 238 228 / 0.14);
        border-radius: 8px;
        background: rgb(20 23 24 / 0.72);
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        font-size: 13px;
        letter-spacing: 0;
      }

      .form {
        display: grid;
        gap: 11px;
        padding: 12px;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .wide-split {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .preview {
        display: grid;
        align-content: start;
        gap: 10px;
        padding: 12px;
        color: #d7ceb8;
        font-size: 12px;
      }

      .state-card,
      .choice-card,
      .status {
        display: grid;
        gap: 6px;
        padding: 10px;
        border: 1px solid rgb(244 238 228 / 0.12);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.34);
      }

      .state-card strong,
      .choice-card strong,
      .status strong {
        color: #f4eee4;
      }

      .status .error {
        color: #ff9b89;
      }

      .status .warning {
        color: #f7c06a;
      }

      .output {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      @media (max-width: 1120px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>Encounter Editor</h1>
          <p>Author choice vignettes, route decisions, world-hold interactions, and delayed repercussions.</p>
        </div>
        <div class="actions">
          <span class="build-version" data-build-version></span>
          <a href="../"><button type="button">Game</button></a>
          <a href="./creator-suite.html"><button type="button">Suite</button></a>
          <a href="./creator-guide.html"><button type="button">Guide</button></a>
          <a href="./level-editor.html"><button type="button">Levels</button></a>
          <button id="downloadButton" type="button">Download JSON</button>
        </div>
      </header>
      <section class="workspace">
        <aside class="panel">
          <h2>Encounter</h2>
          <div class="form">
            <label>
              Asset ID
              <input id="assetIdInput" autocomplete="off" />
            </label>
            <label>
              Display Name
              <input id="displayNameInput" autocomplete="off" />
            </label>
            <div class="split">
              <label>Schema <input id="schemaInput" autocomplete="off" /></label>
              <label>Status <select id="canonStatusSelect"></select></label>
            </div>
            <label>Tags <input id="tagsInput" autocomplete="off" /></label>
          </div>
          <h2>Trigger</h2>
          <div class="form">
            <div class="split">
              <label>Type <select id="triggerTypeSelect"></select></label>
              <label>Distance <input id="triggerDistanceInput" type="number" min="0" step="10" /></label>
            </div>
            <label>Interaction ID <input id="triggerInteractionInput" autocomplete="off" /></label>
          </div>
          <h2>Primary State</h2>
          <div class="form">
            <label>State ID <input id="stateIdInput" autocomplete="off" /></label>
            <div class="split">
              <label>Presentation <select id="presentationModeSelect"></select></label>
              <label>Pause Policy <select id="pausePolicySelect"></select></label>
            </div>
            <label>Title <input id="stateTitleInput" autocomplete="off" /></label>
            <label>Body <textarea id="stateBodyInput" spellcheck="true"></textarea></label>
          </div>
          <h2>Quick Choices</h2>
          <div class="form">
            <div class="wide-split">
              <label>Choices <input id="choiceCountInput" type="number" min="0" step="1" /></label>
              <label>Music <select id="musicStateSelect"></select></label>
              <label>Effect <select id="effectTypeSelect"></select></label>
            </div>
            <label>First Choice Label <input id="firstChoiceLabelInput" autocomplete="off" /></label>
            <label>Route Branch <input id="routeBranchInput" autocomplete="off" /></label>
            <label>Telemetry Tags <input id="telemetryTagsInput" autocomplete="off" /></label>
            <label>Director Tags <input id="directorTagsInput" autocomplete="off" /></label>
            <div class="tool-row">
              <button id="resetButton" type="button">Reset Sample</button>
              <button id="applyJsonButton" type="button">Apply JSON</button>
              <button id="copyJsonButton" type="button">Copy</button>
            </div>
          </div>
        </aside>
        <section class="panel">
          <h2>Outcome Preview</h2>
          <div id="previewPanel" class="preview"></div>
        </section>
        <aside class="panel output">
          <h2>Runtime JSON</h2>
          <div class="form">
            <textarea id="jsonOutput" spellcheck="false"></textarea>
          </div>
          <div id="statusPanel" class="preview"></div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/editor/encounterEditor.js"></script>
  </body>
</html>
