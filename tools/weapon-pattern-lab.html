<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weapon + Pattern Lab - The Long Road of the Weyfinder</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #121616;
        color: #f4eee4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgb(18 22 22 / 0.98), rgb(28 28 25 / 0.96)),
          radial-gradient(circle at 75% 12%, rgb(247 192 106 / 0.1), transparent 28rem);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      input,
      select,
      textarea {
        border: 1px solid rgb(244 238 228 / 0.22);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.55);
        color: #f4eee4;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        font-weight: 760;
        cursor: pointer;
      }

      button:hover {
        border-color: rgb(111 224 191 / 0.58);
      }

      label {
        display: grid;
        gap: 5px;
        min-width: 0;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 700;
      }

      input,
      select {
        min-height: 36px;
        padding: 0 9px;
      }

      textarea {
        width: 100%;
        min-height: 300px;
        padding: 10px;
        resize: vertical;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
      }

      textarea.compact {
        min-height: 92px;
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        background: rgb(8 11 11 / 0.58);
      }

      .title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .title p {
        margin: 3px 0 0;
        color: #d7ceb8;
        font-size: 12px;
      }

      .actions,
      .tool-row,
      .mode-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .actions {
        justify-content: flex-end;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(360px, 1fr) minmax(300px, 420px);
        gap: 14px;
        padding: 14px;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid rgb(244 238 228 / 0.14);
        border-radius: 8px;
        background: rgb(20 23 24 / 0.72);
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        font-size: 13px;
        letter-spacing: 0;
      }

      .form {
        display: grid;
        gap: 11px;
        padding: 12px;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .wide-split {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .mode-row button[aria-pressed="true"] {
        border-color: rgb(247 192 106 / 0.72);
        background: rgb(247 192 106 / 0.16);
      }

      .preview-panel {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .canvas-wrap {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 12px;
      }

      #previewCanvas {
        width: min(100%, 720px);
        aspect-ratio: 1.25;
        border: 1px solid rgb(244 238 228 / 0.18);
        border-radius: 8px;
        background: #0d1010;
      }

      .status {
        display: grid;
        gap: 5px;
        padding: 10px 12px;
        border-top: 1px solid rgb(244 238 228 / 0.12);
        color: #d7ceb8;
        font-size: 12px;
      }

      .status strong {
        color: #f4eee4;
      }

      .status .error {
        color: #ff9b89;
      }

      .status .warning {
        color: #f7c06a;
      }

      .output {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      @media (max-width: 1080px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>Weapon + Pattern Lab</h1>
          <p>Tune weapon and firing-pattern assets that the runtime can validate and consume directly.</p>
        </div>
        <div class="actions">
          <a href="../"><button type="button">Game</button></a>
          <a href="./creator-suite.html"><button type="button">Suite</button></a>
          <a href="./construct-workshop.html"><button type="button">Constructs</button></a>
          <a href="./enemy-editor.html"><button type="button">Enemies</button></a>
          <button id="downloadButton" type="button">Download JSON</button>
        </div>
      </header>
      <section class="workspace">
        <aside class="panel">
          <h2>Asset</h2>
          <div class="form">
            <div class="mode-row">
              <button id="weaponModeButton" type="button" aria-pressed="true">Weapon</button>
              <button id="patternModeButton" type="button" aria-pressed="false">Pattern</button>
              <button id="statusEffectModeButton" type="button" aria-pressed="false">Status Effect</button>
            </div>
            <label>
              Canon Asset
              <select id="assetSelect"></select>
            </label>
            <label>
              Asset ID
              <input id="assetIdInput" autocomplete="off" />
            </label>
            <label>
              Display Name
              <input id="displayNameInput" autocomplete="off" />
            </label>
            <div class="split">
              <label>
                Schema
                <input id="schemaInput" autocomplete="off" />
              </label>
              <label>
                Status
                <select id="canonStatusSelect"></select>
              </label>
            </div>
            <label>
              Tags
              <input id="tagsInput" autocomplete="off" />
            </label>
          </div>
          <h2 id="statsTitle">Weapon Stats</h2>
          <div id="weaponFields" class="form">
            <div class="wide-split">
              <label>Ammo <input id="ammoInput" type="number" min="0" step="1" /></label>
              <label>Heat <input id="heatInput" type="number" min="0" step="1" /></label>
              <label>Cooldown <input id="cooldownInput" type="number" min="0" step="0.01" /></label>
            </div>
            <div class="split">
              <label>Behavior <select id="weaponBehaviorSelect"></select></label>
              <label>Speed <input id="weaponSpeedInput" type="number" min="0" step="1" /></label>
            </div>
            <div class="wide-split">
              <label>Radius <input id="weaponRadiusInput" type="number" min="0" step="0.5" /></label>
              <label>Damage <input id="weaponDamageInput" type="number" min="0" step="0.5" /></label>
              <label>Impulse <input id="weaponImpulseInput" type="number" min="0" step="1" /></label>
            </div>
            <div class="split">
              <label>Lifetime <input id="weaponLifetimeInput" type="number" min="0" step="0.1" /></label>
              <label>Length <input id="weaponLengthInput" type="number" min="0" step="10" /></label>
            </div>
            <div class="wide-split">
              <label>Vertical Velocity <input id="weaponVerticalVelocityInput" type="number" min="0" step="1" /></label>
              <label>Gravity <input id="weaponGravityInput" type="number" min="0" step="1" /></label>
              <label>Arc Height <input id="weaponMaxArcHeightInput" type="number" min="0" step="1" /></label>
            </div>
            <label>Shadow Radius <input id="weaponShadowRadiusInput" type="number" min="0" step="0.5" /></label>
          </div>
          <div id="patternFields" class="form" hidden>
            <div class="split">
              <label>Emitter <select id="patternKindSelect"></select></label>
              <label>Target <select id="patternTargetSelect"><option value="player">player</option></select></label>
            </div>
            <label>Projectile Behavior <select id="patternBehaviorSelect"></select></label>
            <div class="wide-split">
              <label>Delay <input id="initialDelayInput" type="number" min="0" step="0.1" /></label>
              <label>Interval <input id="intervalInput" type="number" min="0.001" step="0.05" /></label>
              <label>Count <input id="countInput" type="number" min="0" step="1" /></label>
            </div>
            <div class="wide-split">
              <label>Speed <input id="patternSpeedInput" type="number" min="0" step="1" /></label>
              <label>Spread <input id="spreadInput" type="number" min="0" step="0.01" /></label>
              <label>Jitter <input id="jitterInput" type="number" min="0" step="0.01" /></label>
            </div>
            <div class="wide-split">
              <label>Sequence Rest <input id="sequenceRestInput" type="number" min="0" step="0.05" /></label>
              <label>Coast Delay <input id="delayBeforeAccelerationInput" type="number" min="0" step="0.05" /></label>
              <label>Max Speed <input id="maxSpeedInput" type="number" min="0" step="1" /></label>
            </div>
            <div class="wide-split">
              <label>Acceleration <input id="accelerationInput" type="number" min="0" step="1" /></label>
              <label>Accel Time <input id="accelerationDurationInput" type="number" min="0" step="0.05" /></label>
              <label>Accel Spread <input id="accelerationSpreadInput" type="number" min="0" step="0.01" /></label>
            </div>
            <div class="split">
              <label>Stop Before Accel <input id="stopBeforeAccelerationInput" type="checkbox" /></label>
              <label>Explode After Accel <input id="explodeAfterAccelerationInput" type="checkbox" /></label>
            </div>
            <div class="wide-split">
              <label>Radius <input id="patternRadiusInput" type="number" min="0" step="0.5" /></label>
              <label>Damage <input id="patternDamageInput" type="number" min="0" step="0.5" /></label>
              <label>Impulse <input id="patternImpulseInput" type="number" min="0" step="1" /></label>
            </div>
            <div class="wide-split">
              <label>Color <input id="patternColorInput" type="color" /></label>
              <label>Absorb HP <input id="absorbHpInput" type="number" min="0" step="1" /></label>
              <label>Absorbs Shots <input id="absorbsPlayerProjectilesInput" type="checkbox" /></label>
            </div>
            <div class="wide-split">
              <label>Vertical Velocity <input id="patternVerticalVelocityInput" type="number" min="0" step="1" /></label>
              <label>Gravity <input id="patternGravityInput" type="number" min="0" step="1" /></label>
              <label>Arc Height <input id="patternMaxArcHeightInput" type="number" min="0" step="1" /></label>
            </div>
            <label>Shadow Radius <input id="patternShadowRadiusInput" type="number" min="0" step="0.5" /></label>
            <div class="wide-split">
              <label>Blast Radius <input id="blastRadiusInput" type="number" min="0" step="0.5" /></label>
              <label>Blast Damage <input id="blastDamageInput" type="number" min="0" step="0.5" /></label>
              <label>Blast Impulse <input id="blastImpulseInput" type="number" min="0" step="1" /></label>
            </div>
            <label>Projectile Lifetime <input id="patternLifetimeInput" type="number" min="0" step="0.1" /></label>
          </div>
          <div id="statusEffectFields" class="form" hidden>
            <div class="wide-split">
              <label>Type <select id="statusEffectTypeSelect"></select></label>
              <label>Intensity <input id="statusEffectIntensityInput" type="number" min="0" step="0.1" /></label>
              <label>Duration <input id="statusEffectDurationInput" type="number" min="0" step="0.1" /></label>
            </div>
            <label>
              Material Rules JSON
              <textarea id="statusEffectMaterialRulesInput" class="compact" spellcheck="false"></textarea>
            </label>
          </div>
        </aside>
        <section class="panel preview-panel">
          <h2>Preview</h2>
          <div class="canvas-wrap">
            <canvas id="previewCanvas" width="800" height="640" aria-label="Weapon and pattern preview"></canvas>
          </div>
          <div id="statusPanel" class="status"></div>
        </section>
        <aside class="panel output">
          <h2>Runtime JSON</h2>
          <div class="form">
            <textarea id="jsonOutput" spellcheck="false"></textarea>
            <div class="tool-row">
              <button id="applyJsonButton" type="button">Apply JSON</button>
              <button id="copyJsonButton" type="button">Copy</button>
            </div>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/editor/weaponPatternLab.js"></script>
  </body>
</html>
