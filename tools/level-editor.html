<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Editor - The Long Road of the Weyfinder</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #121616;
        color: #f4eee4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgb(18 22 22 / 0.98), rgb(27 28 27 / 0.96)),
          radial-gradient(circle at 28% 12%, rgb(111 224 191 / 0.11), transparent 30rem);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      input,
      select,
      textarea {
        border: 1px solid rgb(244 238 228 / 0.22);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.55);
        color: #f4eee4;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        font-weight: 760;
        cursor: pointer;
      }

      button:hover {
        border-color: rgb(247 192 106 / 0.58);
      }

      label {
        display: grid;
        gap: 5px;
        min-width: 0;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 700;
      }

      input,
      select {
        min-height: 36px;
        padding: 0 9px;
      }

      textarea {
        width: 100%;
        min-height: 330px;
        padding: 10px;
        resize: vertical;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        background: rgb(8 11 11 / 0.58);
      }

      .title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .title p {
        margin: 3px 0 0;
        color: #d7ceb8;
        font-size: 12px;
      }

      .actions,
      .tool-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .actions {
        justify-content: flex-end;
      }

      .build-version {
        display: inline-grid;
        place-items: center;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid rgb(244 238 228 / 0.16);
        border-radius: 8px;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 760;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 390px) minmax(420px, 1fr) minmax(320px, 460px);
        gap: 14px;
        padding: 14px;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid rgb(244 238 228 / 0.14);
        border-radius: 8px;
        background: rgb(20 23 24 / 0.72);
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        font-size: 13px;
        letter-spacing: 0;
      }

      .form {
        display: grid;
        gap: 11px;
        padding: 12px;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .wide-split {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .preview-panel {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .canvas-wrap {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 12px;
      }

      #levelCanvas {
        width: min(100%, 760px);
        aspect-ratio: 1.2;
        border: 1px solid rgb(244 238 228 / 0.18);
        border-radius: 8px;
        background: #0d1010;
      }

      .status,
      .dependency-list {
        display: grid;
        gap: 5px;
        padding: 10px 12px;
        color: #d7ceb8;
        font-size: 12px;
      }

      .status {
        border-top: 1px solid rgb(244 238 228 / 0.12);
      }

      .status strong,
      .dependency-list strong {
        color: #f4eee4;
      }

      .status .error {
        color: #ff9b89;
      }

      .status .warning {
        color: #f7c06a;
      }

      .output {
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      @media (max-width: 1120px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>Level Editor</h1>
          <p>Compose runtime level assets from route turns, backgrounds, waves, obstacles, and trigger events.</p>
        </div>
        <div class="actions">
          <span class="build-version" data-build-version></span>
          <a href="../"><button type="button">Game</button></a>
          <a href="./creator-suite.html"><button type="button">Suite</button></a>
          <a href="./creator-guide.html"><button type="button">Guide</button></a>
          <a href="./construct-workshop.html"><button type="button">Constructs</button></a>
          <a href="./weapon-pattern-lab.html"><button type="button">Weapons</button></a>
          <a href="./enemy-editor.html"><button type="button">Enemies</button></a>
          <button id="downloadButton" type="button">Download JSON</button>
        </div>
      </header>
      <section class="workspace">
        <aside class="panel">
          <h2>Level</h2>
          <div class="form">
            <label>
              Asset ID
              <input id="assetIdInput" autocomplete="off" />
            </label>
            <label>
              Display Name
              <input id="displayNameInput" autocomplete="off" />
            </label>
            <div class="split">
              <label>
                Schema
                <input id="schemaInput" autocomplete="off" />
              </label>
              <label>
                Status
                <select id="canonStatusSelect"></select>
              </label>
            </div>
            <label>
              Tags
              <input id="tagsInput" autocomplete="off" />
            </label>
          </div>
          <h2>Composition</h2>
          <div class="form">
            <div class="split">
              <label>Background <select id="backgroundModeSelect"></select></label>
              <label>Start Heading <input id="startHeadingInput" type="number" step="0.01" /></label>
            </div>
            <div class="wide-split">
              <label>Segments <input id="segmentCountInput" type="number" min="1" step="1" /></label>
              <label>Turn Scale <input id="turnScaleInput" type="number" step="0.05" /></label>
              <label>Waves <input id="waveCountInput" type="number" min="0" step="1" /></label>
            </div>
            <div class="wide-split">
              <label>Obstacles <input id="obstacleCountInput" type="number" min="0" step="1" /></label>
              <label>Triggers <input id="triggerCountInput" type="number" min="0" step="1" /></label>
              <label>Procedural Seed <input id="seedOffsetInput" type="number" step="1" /></label>
            </div>
            <div class="tool-row">
              <button id="resetButton" type="button">Reset Sample</button>
              <button id="applyJsonButton" type="button">Apply JSON</button>
              <button id="copyJsonButton" type="button">Copy</button>
            </div>
          </div>
        </aside>
        <section class="panel preview-panel">
          <h2>Route And Events</h2>
          <div class="canvas-wrap">
            <canvas id="levelCanvas" width="840" height="700" aria-label="Level route and event preview"></canvas>
          </div>
          <div id="statusPanel" class="status"></div>
        </section>
        <aside class="panel output">
          <h2>Runtime JSON</h2>
          <div class="form">
            <textarea id="jsonOutput" spellcheck="false"></textarea>
          </div>
          <div id="dependencyList" class="dependency-list"></div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/editor/levelEditor.js"></script>
  </body>
</html>
