<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Construct Workshop - The Long Road of the Weyfinder</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #121616;
        color: #f4eee4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgb(18 22 22 / 0.98), rgb(23 25 24 / 0.96)),
          radial-gradient(circle at 22% 18%, rgb(111 224 191 / 0.12), transparent 32rem);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      select,
      input,
      textarea {
        border: 1px solid rgb(244 238 228 / 0.22);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.54);
        color: #f4eee4;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        font-weight: 760;
        cursor: pointer;
      }

      button:hover {
        border-color: rgb(247 192 106 / 0.55);
      }

      label {
        display: grid;
        gap: 5px;
        min-width: 0;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 700;
      }

      input,
      select {
        min-height: 36px;
        padding: 0 9px;
      }

      textarea {
        width: 100%;
        min-height: 260px;
        padding: 10px;
        resize: vertical;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
      }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        background: rgb(8 11 11 / 0.58);
      }

      .title {
        min-width: 0;
      }

      .title h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .title p {
        margin: 3px 0 0;
        color: #d7ceb8;
        font-size: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .build-version {
        display: inline-grid;
        place-items: center;
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid rgb(244 238 228 / 0.16);
        border-radius: 8px;
        color: #d7ceb8;
        font-size: 12px;
        font-weight: 760;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(260px, 330px) minmax(360px, 1fr) minmax(300px, 420px);
        gap: 14px;
        padding: 14px;
        min-height: 0;
      }

      .panel {
        min-width: 0;
        min-height: 0;
        border: 1px solid rgb(244 238 228 / 0.14);
        border-radius: 8px;
        background: rgb(20 23 24 / 0.72);
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid rgb(244 238 228 / 0.12);
        font-size: 13px;
        letter-spacing: 0;
      }

      .form {
        display: grid;
        gap: 11px;
        padding: 12px;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .tool-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .loadout-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 12px;
      }

      .rig-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .rig-grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .rig-label {
        margin: 6px 0 -2px;
        color: #f4eee4;
        font-size: 12px;
        font-weight: 800;
      }

      .compact-textarea {
        min-height: 86px;
      }

      .canvas-panel {
        display: grid;
        grid-template-rows: auto auto 1fr;
        align-self: start;
      }

      .canvas-wrap {
        display: grid;
        place-items: start center;
        min-height: 0;
        padding: 12px;
      }

      #constructCanvas {
        width: min(100%, 640px);
        aspect-ratio: 1;
        border: 1px solid rgb(244 238 228 / 0.18);
        border-radius: 8px;
        background: #0d1010;
      }

      .status {
        display: grid;
        gap: 5px;
        padding: 10px 12px;
        border-top: 1px solid rgb(244 238 228 / 0.12);
        color: #d7ceb8;
        font-size: 12px;
      }

      .status strong {
        color: #f4eee4;
      }

      .status .error {
        color: #ff9b89;
      }

      .status .warning {
        color: #f7c06a;
      }

      .lookup-panel {
        display: grid;
        gap: 6px;
        padding: 9px;
        border: 1px solid rgb(111 224 191 / 0.22);
        border-radius: 8px;
        background: rgb(111 224 191 / 0.07);
        color: #d7ceb8;
        font-size: 12px;
      }

      .lookup-panel strong {
        color: #f4eee4;
      }

      .lookup-panel code {
        overflow-wrap: anywhere;
        color: #f7c06a;
      }

      .lookup-panel .error {
        color: #ff9b89;
      }

      .lookup-panel .warning {
        color: #f7c06a;
      }

      .list {
        display: grid;
        gap: 6px;
        max-height: 25vh;
        overflow: auto;
        padding: 12px;
      }

      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid rgb(244 238 228 / 0.1);
        border-radius: 8px;
        background: rgb(8 11 11 / 0.36);
        color: #d7ceb8;
        font-size: 12px;
      }

      .item strong {
        color: #f4eee4;
      }

      .danger {
        color: #ffb6a8;
      }

      .output {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      @media (max-width: 1050px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .list {
          max-height: 220px;
        }

        .canvas-panel {
          order: -1;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="title">
          <h1>Construct Workshop</h1>
          <p>Build construct assets using the same JSON shape consumed by the runtime.</p>
        </div>
        <div class="actions">
          <span class="build-version" data-build-version></span>
          <a href="../"><button type="button">Game</button></a>
          <a href="./creator-suite.html"><button type="button">Suite</button></a>
          <a href="./creator-guide.html"><button type="button">Guide</button></a>
          <a href="./mesh-voxelizer.html"><button type="button">Voxelizer</button></a>
          <a href="./enemy-editor.html"><button type="button">Enemies</button></a>
          <button id="resetButton" type="button">Reset</button>
          <button id="downloadButton" type="button">Download JSON</button>
        </div>
      </header>
      <section class="workspace">
        <aside class="panel">
          <h2>Asset</h2>
          <div class="form">
            <label>
              Load Construct
              <select id="constructSelect"></select>
            </label>
            <div class="tool-row">
              <button id="loadConstructButton" type="button">Load Selected</button>
              <button id="refreshConstructsButton" type="button">Refresh Local</button>
            </div>
            <div id="lookupPanel" class="lookup-panel"></div>
            <label>
              Asset ID
              <input id="assetIdInput" autocomplete="off" />
            </label>
            <label>
              Display Name
              <input id="displayNameInput" autocomplete="off" />
            </label>
            <div class="split">
              <label>
                Schema
                <input id="schemaInput" autocomplete="off" />
              </label>
              <label>
                Status
                <select id="canonStatusSelect"></select>
              </label>
            </div>
            <label>
              Tags
              <input id="tagsInput" autocomplete="off" />
            </label>
            <label>
              Cell Type
              <select id="cellTypeSelect"></select>
            </label>
            <div class="split">
              <label>
                Layer
                <input id="layerInput" type="number" min="0" max="31" step="1" />
              </label>
              <label>
                Visible Layers
                <select id="layerViewSelect">
                  <option value="current">Current Only</option>
                  <option value="lower" selected>Lower Ghosted</option>
                  <option value="all">All Ghosted</option>
                </select>
              </label>
            </div>
            <div class="tool-row">
              <button id="paintButton" type="button" aria-pressed="true">Paint</button>
              <button id="eraseButton" type="button" aria-pressed="false">Erase</button>
              <button id="connectButton" type="button" aria-pressed="false">Connect</button>
              <button id="connectAboveButton" type="button">Connect Above</button>
              <button id="connectBelowButton" type="button">Connect Below</button>
            </div>
          </div>
          <h2>Pose Rig</h2>
          <div class="form">
            <div id="poseRigStatus" class="lookup-panel"></div>
            <div class="tool-row">
              <button id="walkerStridePresetButton" type="button">Walker Stride Preset</button>
              <button id="cannonAimPresetButton" type="button">Cannon Aim Preset</button>
              <button id="clearPoseRigButton" type="button" class="danger">Clear Rig</button>
            </div>

            <p class="rig-label">Groups</p>
            <label>
              Load Group
              <select id="poseGroupSelect"></select>
            </label>
            <div class="rig-grid two">
              <label>ID <input id="poseGroupIdInput" autocomplete="off" /></label>
              <label>Role <input id="poseGroupRoleInput" autocomplete="off" /></label>
            </div>
            <label>Selector <input id="poseGroupSelectorInput" autocomplete="off" placeholder="role:supportLeg" /></label>
            <label>Cells <input id="poseGroupCellsInput" autocomplete="off" placeholder="cell-a, cell-b" /></label>
            <div class="rig-grid">
              <label>Pivot X <input id="poseGroupPivotXInput" type="number" step="1" /></label>
              <label>Pivot Y <input id="poseGroupPivotYInput" type="number" step="1" /></label>
              <label>Pivot Z <input id="poseGroupPivotZInput" type="number" step="1" /></label>
            </div>
            <div class="tool-row">
              <button id="savePoseGroupButton" type="button">Save Group</button>
              <button id="removePoseGroupButton" type="button" class="danger">Remove Group</button>
            </div>

            <p class="rig-label">Joints</p>
            <label>
              Load Joint
              <select id="poseJointSelect"></select>
            </label>
            <div class="rig-grid two">
              <label>ID <input id="poseJointIdInput" autocomplete="off" /></label>
              <label>Group <input id="poseJointGroupInput" autocomplete="off" /></label>
            </div>
            <div class="rig-grid">
              <label>Kind <select id="poseJointKindSelect"></select></label>
              <label>Axis X <input id="poseJointAxisXInput" type="number" step="0.1" /></label>
              <label>Axis Y <input id="poseJointAxisYInput" type="number" step="0.1" /></label>
            </div>
            <div class="rig-grid">
              <label>Axis Z <input id="poseJointAxisZInput" type="number" step="0.1" /></label>
              <label>Default X <input id="poseJointTranslateXInput" type="number" step="1" /></label>
              <label>Default Y <input id="poseJointTranslateYInput" type="number" step="1" /></label>
            </div>
            <label>Default Z <input id="poseJointTranslateZInput" type="number" step="1" /></label>
            <div class="tool-row">
              <button id="savePoseJointButton" type="button">Save Joint</button>
              <button id="removePoseJointButton" type="button" class="danger">Remove Joint</button>
            </div>

            <p class="rig-label">Poses</p>
            <label>
              Load Pose
              <select id="poseSelect"></select>
            </label>
            <div class="rig-grid two">
              <label>Pose ID <input id="poseIdInput" autocomplete="off" /></label>
              <label>Target <input id="poseTransformTargetInput" autocomplete="off" placeholder="group:frontLeftLeg" /></label>
            </div>
            <div class="rig-grid">
              <label>Move X <input id="poseTransformXInput" type="number" step="1" /></label>
              <label>Move Y <input id="poseTransformYInput" type="number" step="1" /></label>
              <label>Move Z <input id="poseTransformZInput" type="number" step="1" /></label>
            </div>
            <div class="rig-grid">
              <label>Rotation <input id="poseTransformRotationInput" type="number" step="0.01" /></label>
              <label>Pivot X <input id="poseTransformPivotXInput" type="number" step="1" /></label>
              <label>Pivot Y <input id="poseTransformPivotYInput" type="number" step="1" /></label>
            </div>
            <label>Pivot Z <input id="poseTransformPivotZInput" type="number" step="1" /></label>
            <div class="tool-row">
              <button id="savePoseButton" type="button">Save Pose Transform</button>
              <button id="removePoseButton" type="button" class="danger">Remove Pose</button>
            </div>

            <p class="rig-label">Animations</p>
            <label>
              Load Animation
              <select id="poseAnimationSelect"></select>
            </label>
            <div class="rig-grid two">
              <label>ID <input id="poseAnimationIdInput" autocomplete="off" /></label>
              <label>Kind <select id="poseAnimationKindSelect"></select></label>
            </div>
            <div class="rig-grid two">
              <label>Target <input id="poseAnimationTargetInput" autocomplete="off" placeholder="group:mainCannon" /></label>
              <label>Property <select id="poseAnimationPropertySelect"></select></label>
            </div>
            <div class="rig-grid">
              <label>Amplitude <input id="poseAnimationAmplitudeInput" type="number" step="1" /></label>
              <label>Frequency <input id="poseAnimationFrequencyInput" type="number" step="0.1" /></label>
              <label>Phase <input id="poseAnimationPhaseInput" type="number" step="0.1" /></label>
            </div>
            <div class="rig-grid two">
              <label>Driver <select id="poseAnimationDriverSelect"></select></label>
              <label>Rotation Offset <input id="poseAnimationRotationOffsetInput" type="number" step="0.01" /></label>
            </div>
            <label>
              Keyframes
              <textarea id="poseAnimationKeyframesInput" class="compact-textarea" spellcheck="false" placeholder='[{"at":0,"pose":"strideForward"},{"at":0.5,"pose":"strideBack"}]'></textarea>
            </label>
            <div class="tool-row">
              <button id="savePoseAnimationButton" type="button">Save Animation</button>
              <button id="removePoseAnimationButton" type="button" class="danger">Remove Animation</button>
            </div>

            <p class="rig-label">Raw Rig JSON</p>
            <textarea id="poseRigJsonOutput" class="compact-textarea" spellcheck="false"></textarea>
            <div class="tool-row">
              <button id="applyPoseRigJsonButton" type="button">Apply Rig JSON</button>
            </div>
          </div>
          <h2>Cells</h2>
          <div id="cellList" class="list"></div>
          <h2>Connections</h2>
          <div id="connectionList" class="list"></div>
          <h2>Gun Loadout</h2>
          <div class="loadout-grid">
            <label>Primary 1 <select id="primarySlot0Select" data-slot-kind="primary" data-slot-index="0"></select></label>
            <label>Primary 2 <select id="primarySlot1Select" data-slot-kind="primary" data-slot-index="1"></select></label>
            <label>Secondary 1 <select id="secondarySlot0Select" data-slot-kind="secondary" data-slot-index="0"></select></label>
            <label>Secondary 2 <select id="secondarySlot1Select" data-slot-kind="secondary" data-slot-index="1"></select></label>
            <label>Secondary 3 <select id="secondarySlot2Select" data-slot-kind="secondary" data-slot-index="2"></select></label>
          </div>
        </aside>
        <section class="panel canvas-panel">
          <h2>Grid</h2>
          <div class="canvas-wrap">
            <canvas id="constructCanvas" width="720" height="720" aria-label="Construct grid"></canvas>
          </div>
          <div id="statusPanel" class="status"></div>
        </section>
        <aside class="panel output">
          <h2>Runtime JSON</h2>
          <div class="form">
            <textarea id="jsonOutput" spellcheck="false"></textarea>
            <div class="tool-row">
              <button id="applyJsonButton" type="button">Apply JSON</button>
              <button id="copyJsonButton" type="button">Copy</button>
            </div>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/editor/constructWorkshop.js"></script>
  </body>
</html>
