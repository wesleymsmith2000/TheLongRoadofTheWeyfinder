<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Long Road of the Weyfinder</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #141718;
        color: #f4eee4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #171a1b;
      }

      .hud {
        position: fixed;
        left: 16px;
        top: 14px;
        max-width: min(440px, calc(100vw - 32px));
        color: #f4eee4;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
      }

      .title {
        margin: 0 0 6px;
        font-size: 18px;
        font-weight: 740;
        letter-spacing: 0;
      }

      .sub {
        margin: 0;
        color: #d7ceb8;
        font-size: 13px;
        line-height: 1.45;
      }

      .game-over {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(12 13 13 / 0.64);
        color: #fff6e7;
        font-size: clamp(24px, 7vw, 68px);
        font-weight: 800;
        letter-spacing: 0;
        text-align: center;
        pointer-events: none;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Vehicle roguelite prototype"></canvas>
    <div class="hud">
      <h1 class="title">The Long Road of the Weyfinder</h1>
      <p class="sub">Drive the machine. Lose the machine. Keep the Core moving.</p>
    </div>
    <div id="gameOver" class="game-over hidden">Core Lost<br /><span style="font-size: 18px">Press R</span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
